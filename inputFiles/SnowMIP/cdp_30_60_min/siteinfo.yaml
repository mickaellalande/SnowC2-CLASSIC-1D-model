name: "cdp"
full_name: "Col de Porte, France"
lon: 5.77
lat: 45.30
elevation: 1325 # m
snow_free_albedo: 0.2 #
start: 1994 # 1 October 1994 to 30 September 2014 (remove first and last year for CLASSIC full years)
end: 2014
ZRFH: 1.5 # m
ZRFM: 10 # m
PFTs: "Grass" # use same PFT naming convention as in run_parameters.txt/model code.
leap: ".true." #.true. if the meteorology contains leap years
peatland: "false"
doi: "https://doi.org/10.1594/PANGAEA.897575"
notes: "Grassy meadow bordered by coniferous forest. Soils are 30% clay, 60% sand and 10% silt.

Initialize the model for CLASSIC (CLASS+CTEM) run. Use the updated Leujeune et al. (2019) soil properties.
Use the Menard et al. (2019) forcing but could be extended with the Leujeune et al. (2019) too.

The Grass C3/C4 proportions, soil permeable depth (SDEP), and soil color index (SOCI) are determinte with satellite data.

"

principal_refs: "Morin, S., Lejeune, Y., Lesaffre, B., Panel, J.-M., Poncet, D., David, P., & Sudul, M. (2012). 
