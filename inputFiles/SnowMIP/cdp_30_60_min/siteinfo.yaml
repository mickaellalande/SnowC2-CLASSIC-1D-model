Lejeune, Y., Dumont, M., Panel, J.-M., Lafaysse, M., Lapalus, P., Le Gac, E., Lesaffre, B., & Morin, S. (2019). 
57 years (1960–2017) of snow and meteorological observations from a mid-altitude mountain site (Col de Porte, France, 1325&thinsp;m of altitude). 
Earth System Science Data, 11(1), 71‑88. https://doi.org/10.5194/essd-11-71-2019

"
