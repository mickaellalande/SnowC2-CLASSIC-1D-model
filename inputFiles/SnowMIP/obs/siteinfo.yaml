notes: "Predominantly black spruce, with some tamarack, jack pine and balsam poplar, naturally
regenerated after fire in 1894. Sparse understorey. Peat soil over sandy loam and sand
with a raised water table.

Initialize the model for CLASSIC (CLASS+CTEM) run. Use the Paul's SnowMIP data to set the first 
soil layers proporties and then extrapolate with the satellite data.

See FLUXNET sites for further description."

