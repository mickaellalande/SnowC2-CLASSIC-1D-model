notes: "

- A a continental boreal forest, dominated by black spruce trees

- Similar to CA-NS3; but wet stands had saturated or poorly aerated soil and supported plants adapted specifically to such soil conditions

Vegetation:

- sphagnum (Sphagnum spp.) ground cover
- bog birch (Betula glandulosa var hallii Michx.) understory
- tamarack (Larix laricina (Du Roi) Koch.) and black spruce overstory

- Mean tree height: ~0.5 m in 2005

- leaf area index: ~3 m2 leaf/m2 ground in 2005

- Tree density : ~12000 tree/ha in 2005

- diameter at breast height: ~2.5 cm in 2005

- basal area: ~12 m2/ha in 2005

- Mean Air Temperature: -2.9 °C

- Mean Annual Precipitation: 500 mm 

- soil colour index, sand, clay, orgm, and sdep: from satellite gridded estimates

"

