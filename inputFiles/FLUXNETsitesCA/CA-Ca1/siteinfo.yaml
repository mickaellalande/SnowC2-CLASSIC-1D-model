notes: "
Coastal Douglas-fir stand located on the east coast of Vancouver Island, BC, Canada

Vegetation:

- The oldest stand was planted with Douglas-fir seedlings in 1949 afterthe original stand was logged in 1937 and slash-burned in 1943. 

- 80% Douglas-fir, 17% western red cedar (Thuja plicata Donn) and 3% western hemlock (Tsuga heterophylla (Raf.) Sarg.) 

- fertilized by helicopter in 1994 with urea at an application rate of 200 kg N ha−1

- Mean Air Temperature: 8.3 °C

- Mean Annual Precipitation: 1461 mm 

- average tree height: 30 to 35 m

- measurement height: 43 m for 1996 to 2006, 45 m for 2007 to 2010

- leaf area index: 7.3 m2 leaf/m2 ground in 2004

- stand density: 1150 trees/ ha

- basal area: 29.3-65.2 m2/ha

- Woody debris biomass: 0.7-10.0 kg/m2 in 2002

- Total aboveground biomass: 13.81 kg/m2 in 2002

- Total belowground biomass: 1.25 kg/m2 in 2002

- soil colour index, sand, clay, orgm, and sdep: from satellite gridded estimates

"

