- A continental boreal forest, dominated by black spruce trees

Vegetation:

- Black spruce, with a few senescent jack pine and aspen
- Nearly 100% feather moss cover
- Significant shrub layer of alder, willow, and Labrador tea

- Mean tree height: 12–20 m in 2005

- leaf area index: ~7.5 m2 leaf/m2 ground in 2005

- Tree density : ~16000 tree/ha in 2005

- diameter at breast height: ~4 cm in 2005

- basal area: ~37 m2/ha in 2005

- Mean Air Temperature: -2.9 °C

- Mean Annual Precipitation: 500 mm 

- soil colour index, sand, clay, orgm, and sdep: from satellite gridded estimates

