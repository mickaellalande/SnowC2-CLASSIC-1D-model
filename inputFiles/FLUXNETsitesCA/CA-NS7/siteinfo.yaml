- A continental boreal forest, dominated by black spruce trees

Vegetation:

- Many 10–25 cm tall black spruce. Almost all of the black spruce trees killed in the 1998 fire werestill standing
- Thick, patchy layer of fireweed, wild rose, grass, Labrador tea, alder, and patchy firemoss.

- Mean tree height: ~0.2 m in 2005

- leaf area index: ~2 m2 leaf/m2 ground in 2005

- Mean Air Temperature: -2.9 °C

- Mean Annual Precipitation: 500 mm 

- soil colour index, sand, clay, orgm, and sdep: from satellite gridded estimates

