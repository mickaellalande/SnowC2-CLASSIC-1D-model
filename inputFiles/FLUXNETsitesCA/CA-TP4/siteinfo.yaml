Plantation established in 1939 on a former sandy agricultural field

Vegetation:

- White pine 82% cover area mixed with 11% Balsam fir; 4% Oak; 2% of each, Red maple (Acer rubrum L.) and Wild black cherry (Prunus serotina Ehrh.)

- Oak savanna cleared for afforestation; stand thinned in 1983

- Mean tree height: 21.8±1.7 m in 2010

- Mean tree diameter at DBH: 35.6±5.8 cm in 2010

- stand density: 421±166 trees/ ha in 2010

- leaf area index: 8.0 m2 leaf/m2 ground in 2010

- Woody debris biomass: 5.9 t/ha in 2010

- Forest floor mass: 23.2 t/ha in 2010

- Water table depth below surface: 6-7m in 2010

- Mean Air Temperature: 8 °C

- Mean Annual Precipitation: 1036 mm 

- soil colour index, sand, clay, orgm, and sdep: from satellite gridded estimates

