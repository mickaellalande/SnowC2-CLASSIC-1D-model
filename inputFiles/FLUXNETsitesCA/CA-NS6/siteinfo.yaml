notes: "

- A continental boreal forest, dominated by black spruce trees

Vegetation:

- Many 20–100 cm tall black spruce, 100–200 cm tall jack pine, and 50–400 cm tall aspen.
- Most blackspruce trees killed by the 1989 fire fell from 2000 to 2005
- Thick layer of wild rose, grass, Labrador tea, fireweed, alder, and willow.
- Extensive firemoss withpatches of sphagnum (Sphagnumspp.) and feather (Ptilium,Pleurozium,orHylocomiumspp.) moss.

- Mean tree height: ~1 m in 2005

- leaf area index: ~1.8 m2 leaf/m2 ground in 2005

- Mean Air Temperature: -2.9 °C

- Mean Annual Precipitation: 500 mm 

- soil colour index, sand, clay, orgm, and sdep: from satellite gridded estimates

"

