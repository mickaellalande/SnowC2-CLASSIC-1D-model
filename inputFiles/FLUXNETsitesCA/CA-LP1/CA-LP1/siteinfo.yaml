notes: "

- MPB attack from 2006 to 2012 with ~50% of the canopy attacked in 2006 and only 14% of the canopy trees remaining healthy by 2012

Vegetation:

- mainly lodgepole pine with an understory consisting of pine seedlings, scattered shrubs and a ground cover of moss, lichen and dwarf shrubs

- After the attacks, the 80-year-old stand was not harvested and left to naturally regenerate

- Mean tree height: 15 m 

- leaf area index: 1.24 m2 leaf/m2 ground in 2007
                   0.95 m2/m2 in 2010

- stand density: 1275 ± 204 trees/ ha in 2006

- Basal area: 11.8 - 19.2 m2/ha 

- Litter-fibric-humus C content: 1.10-3.78 kg/m2

- Mineral soil C (0–55 cm): 1.76-3.15 kg/m2

- Fine soil bulk density: 1180 ± 220 kg/m3

- Mean Air Temperature: 2.3 ± 0.7 °C

- Mean Annual Precipitation: 676 ± 115 mm 

- soil texture: gravelly sandy loam

- Soil coarse fragments (% by volume > 2 mm): 34 ± 11 %

- soil colour index, sand, clay, orgm, and sdep: from satellite gridded estimates

"

