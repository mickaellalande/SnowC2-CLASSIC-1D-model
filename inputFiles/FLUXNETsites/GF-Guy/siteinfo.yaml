notes: "
Neotropical Rainforest - Coastal French Guiana

Vegetation:

- 400 ha of undisturbed forest covered by experimental unit

- pristine, tropical, wet forest

- MODIS: Evergreen Broadleaf Forest

- Google Earth: 100% forest cover


Climate:

- tropical wet, mainly driven by north/south movement of ITCZ

- zone brings heavy rains when above French Guiana (December - February, April - July)

- short dry period (March) when located south of French Guiana

- long dry period (August - November) when located to the North

- severity of long, dry period highly variable from year to year

-> some remain mild (eg 2004) with 50 - 100 mm per month

-> some severe (eg 2005) with 4 months < 50 mm precipitation 

- over past decade, average annual       rainfall: 3041 mm"
