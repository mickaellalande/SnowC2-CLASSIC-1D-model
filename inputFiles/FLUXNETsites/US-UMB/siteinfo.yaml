notes: "US-UMB site is located within a protected forest owned by the University of Michigan and consists of mid-aged northern hardwoods, conifer understory, aspen, and old-growth hemlock.

Note: This is different soil textures (sand/clay) than Asaadi et al. (2018) since I found textures in Gough et al. (2002).
 Also I increase the ZRFM and ZRFH from 40 to 46 m due to value in Gough et al. (2000). The SDEP was 2.5 m but SoilGrids250m predicts 32.72 m.
  Gough et al. does say that it is 'on a level to gently sloping high outwash plain derived from glacial drift', so the deeper value seems probable.

The meteorology file is derived from the PLUMBER2 project (https://modelevaluation.org/) which processed it into netcdf format. It is hourly and
 CLASSIC will transform it to the physics timestep on the fly. Half-hourly does not appear to be available.
"
principal_refs: "
