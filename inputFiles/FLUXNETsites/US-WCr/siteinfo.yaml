notes: "
Upland Deciduous Forest - Northern Wisconsin, US


Vegetation:

- 60 - 80 year old stand that occupies ~ 260 ha

- closed canopy, approximately 24 m in height with LAI of 5.3 

- consists mainly of: sugar maple, basswood, green ash

- understory composed of sugar maple and ironwood (Ostrya viginiana, DCD BDL) saplings, leatherwood (DCD shrub), maidenhair (DCD fern), bracken ferns (DCD fern) and blue cohosh (perennial)

- relativly homogenous within 0.6 km of the tower, the approximate flux fottprint, except for minor drainageway (about 80 m wide), located 0.3 km west of tower

-> characterized by: red maple, black ash, slippery elm

- pre-European settlement vegetation consisted primarily of: hemlock, birch, sugar maple, basswood

- forests harvested extensively by early 1900s, likely, that trees growing on this site harvested at least twice since these early land surveys (surveys between 1857 - 1886)

-> 100% COLD-DCD BDL
"
