notes: "
Semiarid Watershed - Southern Arizona, US


Vegetation:

- vegetation on Kendall watershed dominated by grass and forbs with a trace of shrubs and succulents

- canopy cover: 35%

- ground cover during rainy season: 28% rock, 42% litter, 14% basal cover

-> took 35% canopy cover for INI-file

- dominated by herbaceous vegetation, all C4

- site served as grazing land for cattle and horses


Climate:

- mean annual temperature: 18

- average maximum temperature: 35 in June

- average monthly minimum temperature: 2 in December

- two thirds of annual precipitation fall during 'monsoon' season from July through September; much of remainder concentrated in winter months December - February

- channels in Walnut Gulch Experimental Watershed are dry 99% of the time
"
