Scott, R. L., J. A. Biederman, E. P. Hamerlynck, and G. A. Barron-Gafford (2015), The carbon balance pivot point of south-western U.S. semiarid ecosystems: Insights from the 21st century drought, J. Geophys. Res. Biogeosci., 120, 2612–2624, doi:10.1002/2015JG003181
