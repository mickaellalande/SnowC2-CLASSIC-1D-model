notes: "
Boreal Forest - Finland

Original values ZRFH = 23.3 m and ZRFM = 23.3 m. ZRFM was raised to 33.3 m to account for CLASSIC growing a vegetation canopy that was taller than the measurement heights.

Vegetation:

- dominated by Scot spine, homogenous for about 200 m in all directions from measurement site- further from homogenous stand mainly pine-dominated forests cover extended areas

- dominant stand contains only 1% other than Scots pine: downy birch (Betula pubescens), grey alder (Alnus incana) and aspen (Populus tremula), all BDL DCD

- ground vegetation consists of heather (Calluna vulgaris), lingonberry and blueberry

- height of dominant trees in stand: 13 m

- roughness length: 1.2 m

- mean diameter at breast height: 13 cm

- total (all-sided) needle area index: 9 

- tree density: 2500 trees/ ha 

- zero plane displacement: 9 m

- typical growth rate: 8 m3/ha yr

- forest half way through rotation time for this site type which is about 80 years

- height of dominant trees: 14 m (2002)

- all-sided needle area: 8 (2002)

- tree biomass: 68 t/ha above- and belowground

- forest floor: dwarf shrubs and mosses


Climate:

- annual mean temperature: 2.9 (1961 - 1990)

- annual mean precipitation: 709 mm"
