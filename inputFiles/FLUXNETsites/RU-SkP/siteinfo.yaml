notes: "
Larch Forest - Eastern Siberia


Vegetation:

- Situated in the continuous permafrost region in the Lena Delta. Maximum active layer depth (ALT) reached 2-~2.5 m in 2009-2010 (Iijima et al., 2014).
  Increased precipitation following 2006 led to an increase in ALT and increased soil moisture, which saturated the deeper sections of the active layer
  (depth > 25 cm; Iijima et al., 2014).

- The top soil layer was set as an organic layer with mineral soil below, as Siewert et al. (2015) showed organic layer depth of 6.2 +/- 2.8 cm in 
  larch dominated forests in the region. Soil organic carbon (SOC) in the top 1 m was 24.4 +/- 15.8 kg C m-2 and between 1 and 2 m depth SOC was 
  14.2 +/- 7.8 kg C m-2. Cryoturbation was observed in the larch forests and has a high variability with SOC of 11.6 +/- 14.4 kg C m-2 (Siewert et al., 2015).

- Dominant species of overstory: larch with stand density of 840 trees/ ha and LAI of 1.56 (Ohta et al., 2008).
  Maximum LAI is ~1.5 – 2.The LAI of the ground vegetation was ~2.1 with mainly cowberry in 2005 and 1.5 after the conversion to grasses in 2012 (Kotani et al., 2019).

- Except for small patches of birch (COLD DCD BDL) and red pine (EVG NDL), larch forest extends over several kilometres in all directions.
 The canopy cover was 0.72 +/- 0.07 (SD) in June 2017 (Tei et al., 2019). As it's described as a low density stand with a dense understory / 
 ground cover consisting mostly of evergreen cowberry (Vaccinium vitis-idaea), we set the vegetation cover as 72% NdlDcdTr and 28& BdlEvgSh.

- Roots are concentrated in surface soil layer (more than 80% of root surface distributed above depth of 20 cm; only 1.5% deeper than 50 cm)

- Start date of leaf-out of larch trees varied from DOY 175 in 2005 and 149 in 2003; canopy matured in the following 2 - 4 weeks

- Date of leaf fall fluctuated from DOY 240 in 1998 to DOY 265 in 2003, leaves then fell for the following 10 - 20 days


Climate:

- strong continentality

- mean annual rainfall in Yakutsk: 213 mm

-> 30 year climatalogy average: 240 mm

- annual mean temperature: -10.4 deg C

- lowest temperature measured: -57.1 deg C
"
