Amazon Forest - Brazil


General:

- The tower is 58 m for highest emergent trees of 47m. Closed canopy at 40 m

- NOTE: Precipitation does not match literature we looked up


Vegetation:

- located in Tapajos National Forest

- canopy has significant number of large emergent trees to 55 m hieght

- only EVG BDL listed:  Manilhara huberi, Hymenaea courbaril, Betholletia excelsa, Tachigalia spp

- closed canopy at 40 m -> 100% EVG BDL

- large logs, many epiphytes, uneven age distribution and emergent trees: forest can be considered primary or 'old-growth'

- shows no sign of recent anthorpogenic disturbance


Climate

- mean annual temperature: 25

- mean annual precipitation: 2000 mm

- dry season from May through October

- humidity 85%"
