notes: "
Tropical Rainforest - Southern Central Malaysia

Vegetation:

- core area (600 ha) of Pasoh Forest reserve (2450 ha) covered with primary lowland mixed diperocarp forest (tropical EVG BDL) -> 100% EVG BDL

- continuous canopy height: 35 m; some emergent trees exceed 45 m

- estimated LAI (from empirical equations): 6.52


Climate:

- mean annual rainfall: 1804 mm

- total rainfall shows peaks from March to May and October to December

-> characterized by short duration (mean: 3.8h) and relatively high intensity

-> rainfall shows diurnal cycle"
