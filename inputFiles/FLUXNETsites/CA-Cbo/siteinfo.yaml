notes: "
Mixed deciduous forest from natural regrowth in Ontario, Canada

Vegetation:

- 100-year-old forest, consisting of natural re-growth on abandoned farmland

- From the 2006 survey, 52.2% is red maple (Acer rubrum L.), 13.5 % is eastern white pine (Pinus strobus L.),
7% is large-tooth aspen (Populus grandidentata Michx.), and 7% is white ash (Fraxinus americana L.). The rest 20% is from other hardwood species.

- average tree height: 22 m in 2009

- leaf area index: 3.9 (±0.13) m2 leaf/m2 ground in 2009

- stand density: 2996 trees/ ha in 2009

- soil colour index, sand, clay, orgm, and sdep: from satellite gridded estimates

- tree biomass: 2.51 kg m−3

- Mean Air Temperature: 6.4 °C

- Mean Annual Precipitation: 800 mm 

