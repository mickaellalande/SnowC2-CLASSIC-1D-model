notes: "
Steppe - Southern Siberia


Vegetation:

- natural graminoid small-tussock steppe

- steppe wsa managed as a pasture until 2001 but because of the low grazing pressure, no major signs of disturbance over the vegetation composition and structure, 
compared to sites with no mangement history, were found

- plant composition counts 102 species of 26 families

- most numerous belong to: Asteraceae (21 species; C3-C4-intermediate), Poaceae (16 species, can be C3 or C4), Lamiaceae (6 species, CAM), Fabaceae (6 species, C3), Brassicaceae (6 species, mostly C3, some C3-C4-intermediate, no C4)

- perennial living forms prevail (76%), dominant species are: Festuca valesiaca (C3), Koeleria cristata (C3), Stipa krylovi, Cleistogenes squarrosa (C4), Poa botryoides

-> given location 98% C3, 2% C4


Climate:

- semi-arid cool (Koeppen)

- mean annual temperature: 0.4

- seasonal temperature characterized by great continentality (Delta T Jan - July: 35)

- annual precipitation: 304 mm in total, out of which 245 mm is distributed during summer from May to September
"
