notes: "

https://ameriflux.lbl.gov/sites/siteinfo/CA-WP1

This site was called 'AB-Fen' in Wu, Y., Verseghy, D. L. and Melton, J. R.: Integrating peatlands into the coupled Canadian Land Surface Scheme (CLASS) v3.6 and the Canadian Terrestrial Ecosystem Model (CTEM) v2.0, Geoscientific Model Development, 9(8), 2639–2663, 2016. 

The  ecosystem  leaf  area  index,  measured  at  peak  leaf area  in  July  2004,  was  2.6+/-0.16 m2m2(average+/-SE). 

For the interval from August 1, 2003 until September 30,2009,  we  obtained  NEE  data  in  91.1%  of  the  possible  30 min time periods. During a total of 58.9% of possible 30 min time periods, NEE measurements were available and friction velocity  was  above  the  threshold  value  of  0.15 m s-1.  Therefore, gap-filled data included 41.1% of the total possible 30 min time periods during the 6-year study.
"
