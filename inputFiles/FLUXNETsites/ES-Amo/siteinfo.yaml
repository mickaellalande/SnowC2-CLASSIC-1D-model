notes: "
Steppe alpha grass. 

Amoladeras (the “degraded” site), is nearer to the sea, at 50 m asl, with less vegetation cover and shallower soils as a consequence of intensive grazing (Rey et al. 2011).

Elevation: 65 m; slope: 2-6 %; SW orientation

Vegetation: scattered shrubs covering around 30% of the area, predominately Macrochloa tenacissima; Due to the coarse soil texture, physical crusts
are not abundant, and biological soil crusts (BSCs) are the most representative crust types found. BSCs occupy around 30% of the open areas surrounding shrubs.
The remaining area is occupied by a calcaric outcrop and stones.

- dominant plant species: Stipa tenacissima / Steppe alpha grass (Rey et al., 2011) (drought tolerant species)
  Macrochloa tenacissima/Esparto grass

- rooting depth: shallow roots; Stipa tenacissima has a large root:shoot ratio (Rey et al., 2011)

- average Stipa tenacissima height about 60-100 cm, but there are shorter grass species present as well

- ground cover:  23.1 ± 2.4 % vegetation cover, 10.5 ± 2.0 % litter, 23.1 ± 2.8 biological crust, 8.1 ± 0.1 % bare soil, 21.1 ± 0.1 % gravel,
14.0 ± 1.2 % rock (Rey et al., 2011)

Climate:

- mean annual precipitation: 220 mm

- mean annual temperature: 18 degrees C (Rey et al., 2011)

Soils:

-  Soils are Lithic Leptosols (Calcaric), and the texture is sandy loam (Rey et al., 2011)

Soil composition (sand/clay/silt): 58.4 % sand, 14.6 % clay, 27 % silt; ~ 2 % organic C content (Rey et al., 2011)

Soil permeable depth: shallow soil depth of ~10 cm
"
