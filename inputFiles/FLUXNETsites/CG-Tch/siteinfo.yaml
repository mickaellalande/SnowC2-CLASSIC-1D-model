notes: "
Coastal woody grassland - Republic of the Congo

Vegetation:

- region covered by forst-savanna mosaic situated between coastline and Mayombee forest. Described in the paper as a grassland with 100% C4 coverage.

- present grass and shrub savannas result from two interfacing factors: seasonally dry climate and expansion of populations practising savanna burning 

- herbaceous layer dominated by taller Poaceae (e.g. Loudetia simplex)

- some shrubs present (height 1 - 2 m), extensive fires every year mid-June to mid-July

- Loudetia simplex makes up more than 50% of above-ground biomass that reached about 3.8 Mg/ha of dry matter at the end of rainy season in 2008

Climate:

- two season transition equatorial type: long dry and cloudy season from mid-May to mid-October, then rainy season from mid-October to mid-May. Optional short dry season mid-February to mid-May
- mean annual rainfall: 1200mm
- annual temperature: 25"
