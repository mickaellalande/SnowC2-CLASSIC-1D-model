notes: "
Pine Forest - Central Netherlands

Original values ZRFH = 26 m and ZRFM = 26 m. ZRFM was raised to 36 m to account for CLASSIC growing a vegetation canopy that was taller than the measurement heights.

Vegetation:

- forest planted on sand dunes in the beginning of this century, now almost 100 years old 

- existing organic matter was largely removed at that time

- area of Scots pine -> evergreen coniferous

- Google Earth shows minor open spaces -> 98% forest, 2% grass

- understory of Deschampsia flexuosa, a grass that can reach up to 50 cm

- tree heigh: 15.1 m

- roughness length: 2.05 m

- density: 434 trees/ ha

- diameter at breast height: 0.25 m

- LAImax: 1.9"
