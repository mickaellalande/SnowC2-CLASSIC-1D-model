A typical boreal mixedwood forest in northeastern Ontario

Vegetation:

- The average age in 2013 is estimated at beteen 75 and 80 years. 

- Dominated by five species characteristic of Ontario boreal mixedwoods, trembling aspen, black spruce, white spruce, white birch, and balsam fir

- leaf area index: 2–3 m2 leaf/m2 ground

- Mean tree height: 30 m

- Mean Air Temperature: 3.3 °C

- Mean Annual Precipitation: 784 mm 

- Basal area: 22 to 27 m2 / ha

- soil colour index, sand, clay, orgm, and sdep: from satellite gridded estimates

