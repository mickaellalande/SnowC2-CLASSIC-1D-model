notes: "
A mature deciduous broadleaf forest located near the southern edge of the boreal forest in Prince Albert National Park, Saskatchewan

Vegetation:

- Fire in 1919

- Stand average age of 60 years

- The forest consists of trembling aspen with scattered (~10%) balsam poplar overstory and a hazelnut (Corylus cornuta Marsh.) understory.

- The understory accounts for 50% of the total leaf area

- Mean tree height: 21 m in 2010

- stand density: 486 trees/ ha in 2017

- Mean Air Temperature: 0.4 °C

- Mean Annual Precipitation: 467 mm 

- leaf area index: 3.9–5.2 m2 leaf/m2 ground in 2010

- Mean tree diameter at DBH: 17 cm

- soil colour index, sand, clay, orgm, and sdep: from satellite gridded estimates

"

