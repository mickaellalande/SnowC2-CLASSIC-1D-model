notes: "
Temperate Oak Forest - Central Northern France

Vegetation:

- stand composed of: sessile oak (Quercus petraea, DCD BDL): 79% of basal area, hornbeam (Carpinus betulus, DCD BDL): 18% of basal area, dominates understory,
 Pinus sylvestris L., Sorbus torminalis, make up less than 3 % of basal area; put 1% to EVG NDL, Corylus avellana, Mespilus germanica 

- dominant height: 25 m at age 100 year

- LAI: 6.4 averaged over 2006 - 2010

- commercial thinning began in winter 2010/2011 and was pursued up to following winter

  -> LAI fully recovered in 2012

Climate

- mean annual air temperature: 11.2

- mean annual precipitation: 677 mm

- homogenous distribution of precipitation events throughout the year"
