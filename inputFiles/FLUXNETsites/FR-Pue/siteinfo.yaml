notes: "
Mediterranean Forest - Southern France

Vegetation:

- forest managed as coppice for centuries and was last cut in 1942

- vegetation largely dominated by dense overstory of evergreen oak Q.Ilex -> 100% EVG BDL 

- mean tree height: 5 m 

- density of resprouted stem: 6885 stems/ha in 2005

- stems with diamter at breast hight: < 4 cm: 12% of total stems, > 10 cm: 15.25 % of total stems

- aboveground biomass: 12.3 kg dry matter/ m2 in 2005

- understory compose sparse (< 25%) shrubby <2 m high layer with: Bexus sempervirens, Phyllirea latifolia, Pistacia terebinthus and Juniperus oxycedrus being most abundant species 

- overstory LAI: 2.8 +- 0.4


Climate

- mediterrenean climate with annual rainfall of 907 mm/yr and a range of 546 - 1549 mm for 1984 - 2006

- precipitation occurs during autumn and winter with about 80% of annual rainfall occuring between September and April

- mean annual temperature over same period 13.4 with minimum in January (5.5) and maximum in July (22.9)"
