notes: "The US-Ha1 site is owned by Harvard University. Most of its surrounding area was cleared for agriculture during European settlement in 1600–1700. The trees at the site have been regrowing
 since before 1900. Climate measurements have been made at the Harvard Forest since 1964.

The area surrounding the tower is dominated by red oak (Quercus rubra) and redmaple (Acer rubrum), with scattered stands of Easternhemlock (Tsuga canadensis), white pine (Pinus strobus)and red pine (P. resinosa).

 Harvard Forest is heterogeneous, reflecting topography and past land use. Portions were cleared for agriculture between 1790 and 1830, then abandoned, reverting to forest by 1890 (24). Commercial logging in the 1920s and 1930s declined after a devastating hurricane in 1938.

Note: This is different soil textures (sand/clay) than Asaadi et al. (2018), here I use the SoilGrid250m data directly. From all papers I was able to find they never describe the soils (can also be seen in Curtis et al.). Also I increase the ZRFM and ZRFH from 40 to 29 m due to value in Urbanski et al. (2007). The SDEP was 2.5 m but SoilGrids250m predicts 11.65 m. I reduce the vegetated area to 0.95 following Wofsy et al. (1993).

The meteorology file is derived from the PLUMBER2 project (https://modelevaluation.org/) which processed it into netcdf format. It is hourly and CLASSIC will transform it to the physics timestep on the fly. Half-hourly does not appear to be available.
"
