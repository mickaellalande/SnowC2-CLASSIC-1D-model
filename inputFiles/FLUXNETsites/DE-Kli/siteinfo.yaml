notes: "
Cropland - East Germany

Vegetation:

- partially grassland before 1975

- cultivated, organic and mineral fertilizer since 1975

- winter barley (2004), rapeseed (2004/ 2005), winter wheat (2005/2006), maize (2007), spring barley (2008)

- in 2008 full 5-year crop rotation was completed and winter barley was sown again

The organic soil horizon (Ap) of the drained Gleysol was identified on average as a medium clayey loam with a mean thickness of 0.2 m. Within the B horizon, mainly slightly sandy clay and clayey sandy loam were observed. The mean values of C content in horizons Ap and B were 43 and 3 g C kg−1, respectively. The total soil carbon stock to 60 cm depth was 97 t C ha−1, and the mean C/N ratio was 13 .
"
