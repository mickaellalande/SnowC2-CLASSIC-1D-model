notes: "Southern Arctic tundra site, erect-shrub tundra, tundra dominated by low shrubs <40 cm, continuous permafrost
Elevation: 425 m

~300 km northeast of Yellowknife, ~70 km north of the treeline in Canada's Southern Arctic ecozone

Vegetation:

- dominant plant species: evergreen shrubs (Rhododendron tomentosum,Empetrum nigrum,Loiseleuria procumbens) and deciduous shrubs 
(Betula glandulosa,Vaccinum uliginosum) (Lafleur and Humphreys, 2018). Small variations in microtopography result in wet areas 
covering about 10% of the area within 100 m of the measurement tower, which support tussock-forming sedges and Sphagnum species. 

- rooting depth: ~40 cm

- average plant height ~18 cm

- average LAI in July: 0.52 ± 0.05 m2/m2 (± SE)

- plant cover:  60 % vascular plants, 40 % bare ground in CLASSIC (in reality most of the ground is covered by lichen and moss)
percent ground cover: mosses 16.5 ± 4.9 % and lichens 78.9 ± 5.0 % (Lafleur and Humphreys, 2018).

Climate:

- mean annual precipitation: 250 mm (Fluxnet)

- mean annual temperature: -9 degrees C (Fluxnet)


Soils:

- continuous permafrost with average thaw depth of 0.86 ± 0.03 m (± SE) measured over the period 2010-2015 (Lafleur and Humphreys, 2018)

Soil composition (sand/clay/silt):  shallow (1-10 cm deep) surface soil organic layer (in better drained areas), deepening to 20 cm 
or more in wetter areas; in CLASSIC, the top 10 cm layer is organic (fibric) underlain by coarse textured (sand to loamy sand) mineral soil with 
80 % sand / 4.4 % clay / 3 % organic matter (apart from the 2nd layer, which was assigned 8% organic matter)

Soil permeable depth: set to 5 m (rough estimate)

Soil carbon: 18.5 ± 4.7 kg C m^{-2} (± SD) for 0-80 cm depth

PI: Elyn Humphreys, Peter Lafleur
"
