notes: "
Czech Republic

Original values ZRFH = 25 m and ZRFM = 25 m. ZRFM was raised to 35 m to account for CLASSIC growing a vegetation canopy that was taller than the measurement heights.

Vegetation:

- Norway spruce monoculture with only 1% of silver fir -> 100% EVG NDL 

- Google Maps shows 100% forest cover

- planted in 1981 with four-year-old seedlings

- stand density: 2000 trees/ha

- mean canopy height: 12 m

- mean DBH: 13 cm

- LAI: 10.5 m2/m2

- ground vegetation dominated by blueberries


Climate:

- See Niu et al., 2011
"
