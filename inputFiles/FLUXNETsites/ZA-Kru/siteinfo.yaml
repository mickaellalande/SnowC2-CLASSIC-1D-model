notes: "
Savanna - Kruger National Park, South Africa


Vegetation:

- 28% tree cover, evenly mixed between: Combretum apiculatum, Acacia migrescens (both deciduous broadleaf

- 72% grass layer dominated by: Panicum maximum (C4), Digataria eriantha (C4), Eragrostis rigidor (C4?), Pogonarthria squarrosa (C4)

-> 100% C4 in CTM 

- woody plant basal area: 7m2/ha

- tree canopies average 5 - 8 m high with occasional trees reaching 10 m

- growing season LAI average about 1.1; has reached as high as 2.0 for more extended record


Climate:
- annual precipitation: 550 +- 160 mm; rainy days per year almost entirely between November and April
- year divided into hot, occasionally wet growing season and warm, dry non-growing season
"
