notes: "
Primary Tropical Forest - Southwest Ghana


Vegetation:

- site in Ankasa Conservation Area in Southwest Ghana on border with the Ivory coast

- covers 509 km2 

- hosts ancient rainforest and th emost biodiverse in Ghana

- represents only wet evergreen protected area in almost pristine state

- home to over 800 vascular plant species


Climate:

- distinctive bi-modal rainfall pattern ocurring from April to July and September to November

- average rainfall: 1700 - 2000 mm

- mean amonthly temepratures range from 24 - 28

- relative humidity generally high throughout the year, being about 90% during the night, falling to 75% in early afternoon"
