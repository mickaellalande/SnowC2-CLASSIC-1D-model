notes: "
Peat development has occurred for over 6000 years in the area 

- Vegetation: dominated by the sedge and an understory of the moss

- Soil: the active layer can extend to a depth of more than 1.5 m

- Water table: Fluctuates from 15 cm below to 20 cm above the mean sedge–peat surface

- Mean Air Temperature: -6.5 °C

- Mean Annual Precipitation: 452 mm 

- soil colour index, sand, clay, orgm, and sdep: from satellite gridded estimates

- Cmossmass and litrmsmoss: Used the value from CA-WP1

