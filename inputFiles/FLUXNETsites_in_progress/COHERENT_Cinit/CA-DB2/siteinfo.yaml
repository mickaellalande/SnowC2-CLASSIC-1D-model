notes: "

Disturbed raised bog ecosystem (peat harvesting 1930 to 1948). Site has been passively restored and rewetted in 2007 by ditch blocking.

Vegetation:

- depth of peat at the study site is 4 m

- plant communities in the study ecosystem are dominated by Pine, Sphagnum, and white beak-rush

- Some areas of Sphagnum hummocks are separated by large vegetated hollows

- Sphagnum covers over 25 % of the surface and the open water ponds was estimated to be about 5 %

- Mean Air Temperature: 10.4 °C

- Mean Annual Precipitation: 1189 mm 

- Water table height: 30 cm above ground to 30 cm below ground

- average canopy height: 0.9m~1.3m

- soil colour index, sand, clay, orgm, and sdep: from satellite gridded estimates

- Cmossmass and litrmsmoss: Used the value from CA-WP1

"

