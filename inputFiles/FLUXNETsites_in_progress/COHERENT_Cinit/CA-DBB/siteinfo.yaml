notes: "

Disturbed raised bog ecosystem (peat harvesting 1957 to 1963). Site has been restored and rewetted in 2007 by ditch blocking.

Vegetation:

- depth of peat at the study site is 5.83 m

- plant communities in the study ecosystem are dominated by Sphagnum spp. and Rhynchospora alba

- Plants are separated by shallow open water pools

- Sphagnum covers over 25 % of the surface and the open water ponds was estimated to be about 20 %

- Mean Air Temperature: 10.4 °C

- Mean Annual Precipitation: 1189 mm 

- Water table height: 30 cm above ground to 30 cm below ground

- average canopy height: 0.5m~0.8m

- soil colour index, sand, clay, orgm, and sdep: from satellite gridded estimates

- Cmossmass and litrmsmoss: Used the value from CA-WP1

"

