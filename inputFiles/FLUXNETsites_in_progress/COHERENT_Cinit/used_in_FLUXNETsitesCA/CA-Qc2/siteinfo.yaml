notes: "

Vegetation:

- Clear-cut in 1975 and precommercial thinning over 70% of the flux footprint area in 1998

- dominated by black spruce (90% of the canopy) and tamarack (Larix laricina (Du Roi) K. Koch) is present in humid areas. 

- ground cover consists of ericaceous shrubs (Kalmia angustifolia L., Vaccinium angustifolium Ait. and Rhododendron groenlandicum (Oeder) Kron et Judd), mosses (Pleurozium schreberi (BSG) Mitt. and Sphagnum spp.) and lichen (Cladina spp.)

- Mean Air Temperature: 10.8 °C

- Mean Annual Precipitation: 830 mm 

- average tree height: 8.9 m in 2008

- canopy leaf area index: 1.9 m2 leaf/m2 ground in 2008

- total leaf area index: 3.5 m2 leaf/m2 ground in 2008

- stand density: 2725 trees/ ha in 2008

- diameter at breast height: 3.9 cm in 2008

- soil colour index, sand, clay, orgm, and sdep: from satellite gridded estimates

"

