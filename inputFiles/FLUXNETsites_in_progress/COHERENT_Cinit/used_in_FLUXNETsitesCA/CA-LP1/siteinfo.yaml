notes: "

- MPB attacks in 2005 and 2006

Vegetation:

- 57% lodgepole pine and 43% hybrid white spruce

- After the attacks, the 70-year-old stand was partially harvested in a 40 ha cutblock

- Mean tree height: 16 m in 2013

- leaf area index: 1.3 m2 leaf/m2 ground in 2013

- stand density: 435 trees/ ha in 2013

- Basal area: 7.6 m2/ha in 2010

- Top forest floor organic layer C: 30.6-42.6 kg/ha in 2013

- Mineral soil C (0–55 cm): 75.6-158.9 kg/ha in 2013

- Mean Air Temperature: 4 °C

- Mean Annual Precipitation: 570 mm 

- soil colour index, sand, clay, orgm, and sdep: from satellite gridded estimates

