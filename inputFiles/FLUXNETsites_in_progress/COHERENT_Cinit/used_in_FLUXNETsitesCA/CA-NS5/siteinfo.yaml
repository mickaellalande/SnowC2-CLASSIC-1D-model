notes: "

- A continental boreal forest, dominated by black spruce trees

Vegetation:

- Dense stand of 500 cm tall jack pine with scattered 500 cm tall aspen. Many 100–200 cm tall blackspruce.
- Continuous ground cover of grass, Labrador tea, willow, and wild rose.
- Mix of sphagnumand feather moss.
- Most black spruce trees killed by the 1981 fire had fallen before 2000

- Mean tree height: ~0.5 m in 2005

- leaf area index: ~2.3 m2 leaf/m2 ground in 2005

- Tree density : ~12000 tree/ha in 2005

- diameter at breast height: ~1.8 cm in 2005

- basal area: ~3 m2/ha in 2005

- Mean Air Temperature: -2.9 °C

- Mean Annual Precipitation: 500 mm 

- soil colour index, sand, clay, orgm, and sdep: from satellite gridded estimates

"

