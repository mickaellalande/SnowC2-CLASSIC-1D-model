notes: "

This field (39ha) had been hay/pasture for several decades before conversion to annual cropping in 2008.

Vegetation:

- Had a rotation of an oat crop (2009), canola (Brassica napus L.) crop (2010) and oat crop (2011)

- Mean Air Temperature: 2.6 °C

- Mean Annual Precipitation: 514 mm 

- Soil pH is 8

- soil bulk density: 1 and 1.3 Mg/m3 in the 0–15 and 15–30 cm layers, respectively
- Nitrate contents were about 3 mg N kg−1, and phosphorus was 12, potassium was 150 and sulphur was 5 mg kg−1
- Organic carbon content was 90 and 40 g C kg−1 in the 0–15 and 15–30 cm layers, respectively

- soil colour index, sand, clay, orgm, and sdep: from satellite gridded estimates



"

