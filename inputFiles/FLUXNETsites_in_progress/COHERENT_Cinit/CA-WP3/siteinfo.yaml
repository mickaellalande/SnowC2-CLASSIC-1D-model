notes: "
A flat extreme-rich fen site dominated by sedge

Vegetation:

- mainly consisted of the sedge Carex lasiocarpa (Ehrh.)
- brown moss species (48%) Drepanocladus aduncus ([Hedw.] Warnst.) and Aulacomnium palustre ([Hedw.] Schwaegr.) was present at the base of the sedge plants
- Shrubs (average height < 0.5 m) covered approximately 5% of the fen and consisted primarily of Salix pedicellaris (Pursh) and the occasional Betula pumila (L.) var. glandulifera (Regel).

- average tree height: shrubs were <0.5m

- leaf area index: about 0.8 m2 leaf/m2 ground durin 2004 growing season

- soil colour index, sand, clay, orgm, and sdep: from satellite gridded estimates

- Live aboveground biomass: 157.1 ± 16.6 g m−2

- Mean Air Temperature: 2.1 °C, frost-free period of 85–90 days

- Mean Annual Precipitation: 504 mm 

- Cmossmass and litrmsmoss: Used the value from CA-WP1

"

