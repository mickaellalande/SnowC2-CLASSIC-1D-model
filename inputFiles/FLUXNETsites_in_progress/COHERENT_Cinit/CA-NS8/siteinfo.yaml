notes: "

- A continental boreal forest, dominated by black spruce trees

Vegetation:

- Many 2–4 cm tall black spruce and jack pine seedlings. Almost all of the black spruce trees killed in the 2003 fire werestill standing
- Rapidly developing herbaceous layer of wild rose, fireweed, grass, Labrador tea, alder, willow, poplar,and aspen

- Mean tree height: ~0.05 m in 2005

- leaf area index: ~1.5 m2 leaf/m2 ground in 2005

- Mean Air Temperature: -2.9 °C

- Mean Annual Precipitation: 500 mm 

- soil colour index, sand, clay, orgm, and sdep: from satellite gridded estimates

