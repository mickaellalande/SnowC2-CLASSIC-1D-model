notes: "

- A chronosequence of four jack pine (Pinus banksiana Lamb.) stands, located approximately 100 km northeast of Prince Albert, Saskatchewan, Canada

Vegetation:

- Tree regeneration at the harvested sites was from seeds (cones) left behind following the whole-tree harvest; no additional planting was conducted

- No understory

- Mean tree height: 8 m in 2005

- leaf area index: 3.1 m2 leaf/m2 ground in 2005

- Mean tree diameter at DBH: 5.7 cm in 2005

- stand density: 6385 trees/ ha in 2005

- Live above ground C: 21.1±1.0 t/ha in 2005

- Dead above ground C: 3.6±0.9 t/ha in 2005

- Root C: 9.1±1.0 t/ha in 2005

- Top forest floor organic layer C: 8.8±1.5 t/ha in 2005

- Mineral soil C (0–50 cm): 18.4±2.7 t/ha in 2005

- Mean Air Temperature: 0.11 °C

- Mean Annual Precipitation: 430 mm 

- soil colour index, sand, clay, orgm, and sdep: from satellite gridded estimates

"

