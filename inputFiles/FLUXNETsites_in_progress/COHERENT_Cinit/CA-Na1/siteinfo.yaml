Mature balsam fir forest

- Vegetation: Composed of sugar and red maple, yellow birch, red spruce, balsam fir (~90% of the total site volume), eastern white pine and hemlock. Age was 32-37 in 2005.

- Mean number of growing degree days: 1583 days

- stand density: 2250 trees/ ha

- Mean tree height: 13.5 m

- Mean tree diameter at DBH: 12.9 cm

- Leaf area index: 8.3 m2 leaf / m2 ground

- Basal area: 30 m2/ha

- Average rooting depth: 32.3±9.6cm

- Soil pH: 4.1±0.09 

- Mean Air Temperature: 3.5 °C

- Mean Annual Precipitation: 972 mm 

- soil colour index, sand, clay, orgm, and sdep: from satellite gridded estimates

