notes: "
A “patterned fen” consisting of alternating hummocks and hollows.

Vegetation:

- dominated by a continuous ground layer of Sphagnum spp. (68%), consisting of a mixture of S. angustifolium ([C. Jens. ex Russ.] C. Jens. in Tolf), S. magellanicum (Brid.), and S. fuscum ([Schimp.] Klinggr.).
- the evergreen shrub Andromeda polifolia (L.), the herb Smilacina trifolia ([L.] Desf.), and the sedge Carex limosa (L.) were present
- Some dwarf (average height < 0.75 m) Picea mariana ([Mill.] BSP.) and Larix laricina ([Du Roi] K.Koch) trees are along strings in the fen.

- average tree height: trees were <0.75m

- leaf area index: about 1.2 m2 leaf/m2 ground durin 2004 growing season

- soil colour index, sand, clay, orgm, and sdep: from satellite gridded estimates

- Live aboveground biomass: 230.9 ± 15.3 g m−2

- Mean Air Temperature: 2.1 °C, frost-free period of 85–90 days

- Mean Annual Precipitation: 504 mm 

- Cmossmass and litrmsmoss: Used the value from CA-WP1

"

